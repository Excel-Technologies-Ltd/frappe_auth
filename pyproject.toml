[project]
name = "frappe_auth"
authors = [
    { name = "Shaid Azmin", email = "azmin@excelbd.com"}
]
description = "Frappe Auth modernizes legacy authentication by replacing it with secure Bearer token–based session management. It also overrides socket handling to support custom apps, enabling seamless integration between Frappe and external platforms for flexible, scalable, and efficient connectivity."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"
